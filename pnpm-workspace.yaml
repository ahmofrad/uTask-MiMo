packages:
  - "."

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - cpu-features
  - esbuild
  - msgpackr-extract
  - prisma
  - protobufjs
  - sharp
  - ssh2
  - unrs-resolver

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - shadcn@4.13.0
  - tsx@4.23.0
peerDependencyRules:
  allowedVersions:
    nodemailer: ">=9.0.1"
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-2v37-7h3g-55p8

overrides:
  '@auth/core': 0.41.3
  '@hono/node-server': 2.0.10
  brace-expansion: 5.0.9
  dompurify: 3.4.13
  fast-uri: 3.1.5
  hono: 4.12.34
  ip-address: 10.3.1
  js-yaml: 4.3.1
  nanoid: 3.3.17
  postcss: 8.5.23
  sharp: 0.35.3
  socket.io-parser: 4.2.7
  tldts-core@^7.4.10: 7.4.9
  tmp: 0.2.7
  undici@^7.25.0: 7.29.0
  uuid: 11.1.1
