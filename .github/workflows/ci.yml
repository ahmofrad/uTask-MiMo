name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://taskapp:taskapp@localhost:5432/taskapp
      REDIS_URL: redis://localhost:6379
      DB_PASSWORD: ci-only-db-password
      S3_ACCESS_KEY: ci-only-s3-access
      S3_SECRET_KEY: ci-only-s3-secret
      AUTH_SECRET: ci-only-auth-secret
      WEBHOOK_SECRET_ENCRYPTION_KEY: ci-only-webhook-key
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskapp
          POSTGRES_USER: taskapp
          POSTGRES_PASSWORD: taskapp
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm i18n:check
      - run: pnpm design:check
      - run: pnpm pwa:check
      - run: pnpm audit --audit-level=high
      - run: pnpm build
      - run: pnpm build:server
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: azure/setup-helm@v4
      - run: >-
          helm lint ops/helm/taskapp
          --set config.authUrl=https://taskapp.example.com
          --set secret.dbPassword=ci-db-password
          --set secret.authSecret=ci-auth-secret
          --set secret.webhookSecretEncryptionKey=ci-webhook-key
          --set secret.s3AccessKey=ci-s3-access
          --set secret.s3SecretKey=ci-s3-secret
      - run: |
          helm template taskapp ops/helm/taskapp \
            --set config.authUrl=https://taskapp.example.com \
            --set secret.dbPassword=ci-db-password \
            --set secret.authSecret=ci-auth-secret \
            --set secret.webhookSecretEncryptionKey=ci-webhook-key \
            --set secret.s3AccessKey=ci-s3-access \
            --set secret.s3SecretKey=ci-s3-secret > /tmp/taskapp-rendered.yaml
          grep -q 'taskapp-migrate-1' /tmp/taskapp-rendered.yaml
          grep -q 'wait-for-migrations' /tmp/taskapp-rendered.yaml
          grep -q 'taskapp-pgbouncer:6432/taskapp' /tmp/taskapp-rendered.yaml
          grep -Eq 'postgresql://taskapp:[^@]+@[^:]+-pgbouncer:6432/taskapp' /tmp/taskapp-rendered.yaml
      - run: |
          cp ops/docker/.env.prod.example .env.prod
          trap 'rm -f .env.prod' EXIT
          docker compose --env-file .env.prod -f ops/docker/docker-compose.prod.yml config --quiet
