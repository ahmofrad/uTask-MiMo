<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>uTask — Offline</title>
    <style>
      :root {
        --bg: #f1f1f3;
        --fg: #18181b;
        --muted: #52525b;
        --accent: #2563eb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e4e4e7;
        border-radius: 16px;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.08);
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1rem;
      }
      .logo svg { width: 30px; height: 30px; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { color: var(--muted); margin: 0.25rem 0; line-height: 1.6; font-size: 0.95rem; }
      .hint {
        margin-top: 1.25rem;
        font-size: 0.8rem;
        color: var(--muted);
        background: var(--bg);
        border-radius: 10px;
        padding: 0.6rem 0.8rem;
      }
      [dir="rtl"] { direction: rtl; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 16.5l4.5 4.5L23 11" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h1>You are offline</h1>
      <p lang="en">This page isn't available without a connection.</p>
      <p lang="fa" dir="rtl">این صفحه در حالت آفلاین در دسترس نیست.</p>
      <p lang="en">Pages you've already opened should still work.</p>
      <p lang="fa" dir="rtl">صفحه‌هایی که قبلاً باز کرده‌اید همچنان در دسترس خواهند بود.</p>
      <div class="hint">Try again once you're back online · اتصال خود را برقرار کنید</div>
    </div>
  </body>
</html>
