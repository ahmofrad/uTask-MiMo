# ──────────────────────────────────────────────
# TaskApp — Production Docker Compose
# HA application/cache/object-storage reference topology.
#
# This file intentionally keeps PostgreSQL as one primary behind PgBouncer.
# Automatic PostgreSQL failover requires an external HA operator (for example
# Patroni) and must not be implied by a second ordinary Postgres container.
# ──────────────────────────────────────────────
#
# Run with the production environment explicitly:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# The app and worker containers require outbound TCP 443 (and, where needed,
# TCP 80) to customer-approved webhook destinations. Enforce the allowlist at
# the host firewall or an egress proxy; Docker bridge networking does not
# provide destination-level egress policy by itself.

x-app-env: &app-env
  env_file: ${TASKAPP_ENV_FILE:-../../.env.prod}
  environment:
    DATABASE_URL: "postgresql://taskapp:${DB_PASSWORD:?DB_PASSWORD must be set}@pgbouncer:6432/taskapp"
    REDIS_SENTINEL_NAME: taskapp-primary
    REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
    REDIS_SENTINEL_PASSWORD: "${REDIS_SENTINEL_PASSWORD:?REDIS_SENTINEL_PASSWORD must be set}"

x-app-common: &app-common
  image: taskapp/app:${APP_VERSION:-1.0.0}
  <<: *app-env
  networks:
    - taskapp-net
  restart: unless-stopped

x-redis-node: &redis-node
  image: redis:7-alpine
  env_file: ${TASKAPP_ENV_FILE:-../../.env.prod}
  networks:
    - taskapp-net
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s

x-sentinel-node: &sentinel-node
  image: redis:7-alpine
  env_file: ${TASKAPP_ENV_FILE:-../../.env.prod}
  networks:
    - taskapp-net
  restart: unless-stopped
  command:
    - sh
    - -ec
    - |
      cat >/tmp/sentinel.conf <<EOF
      port 26379
      protected-mode no
      requirepass $${REDIS_PASSWORD}
      sentinel monitor taskapp-primary redis-1 6379 2
      # Without this, Redis 7+ treats the monitor address as a literal IP and
      # aborts at startup with "Can't resolve instance hostname" when it is a
      # hostname (resolve-hostnames defaults to no).
      sentinel resolve-hostnames yes
      sentinel auth-pass taskapp-primary $${REDIS_PASSWORD}
      sentinel down-after-milliseconds taskapp-primary 5000
      sentinel failover-timeout taskapp-primary 60000
      sentinel parallel-syncs taskapp-primary 1
      EOF
      exec redis-server /tmp/sentinel.conf --sentinel
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -p 26379 -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s

x-minio-node: &minio-node
  image: minio/minio:RELEASE.2024-08-29T01-40-52Z
  env_file: ${TASKAPP_ENV_FILE:-../../.env.prod}
  environment:
    MINIO_ROOT_USER: "${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}"
    MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:?S3_SECRET_KEY must be set}"
  command:
    - server
    - http://minio-1/data
    - http://minio-2/data
    - http://minio-3/data
    - http://minio-4/data
    - --console-address
    - :9001
  networks:
    taskapp-net:
      aliases:
        - minio
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      # Plain-HTTP mode (TASKAPP_HTTP_ONLY=true) serves the site on this port.
      - "${TASKAPP_HTTP_PORT:-80}:80"
    volumes:
      # HTTP-only deployments switch this to ./nginx.http.conf.
      - ${TASKAPP_NGINX_CONF:-./nginx.conf}:/etc/nginx/nginx.conf:ro
      - ${TASKAPP_TLS_CERT_FILE:-./certs/cert.pem}:/etc/nginx/certs/cert.pem:ro
      - ${TASKAPP_TLS_KEY_FILE:-./certs/key.pem}:/etc/nginx/certs/key.pem:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    networks:
      - taskapp-net
    restart: unless-stopped

  app-1:
    <<: *app-common
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      minio-1:
        condition: service_healthy
      minio-2:
        condition: service_healthy
      minio-3:
        condition: service_healthy
      minio-4:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health?ready=1').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  app-2:
    <<: *app-common
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      minio-1:
        condition: service_healthy
      minio-2:
        condition: service_healthy
      minio-3:
        condition: service_healthy
      minio-4:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health?ready=1').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    image: taskapp/app:${APP_VERSION:-1.0.0}
    command: ["node", "dist/worker.js"]
    <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    networks:
      - taskapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/taskapp-worker-ready && kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    image: taskapp/app:${APP_VERSION:-1.0.0}
    # Run migrations on every `up`. The image ENTRYPOINT (scripts/entrypoint.sh)
    # gates on RUN_MIGRATIONS and runs `prisma migrate deploy` (with retry)
    # before exec-ing the command. `true` is the no-op command so the
    # container exits 0 once migrations land.
    #
    # IMPORTANT: a stale image will report "No pending migrations" against a
    # wiped DB and exit 0, silently leaving prod schemaless. Rebuild the
    # image whenever prisma/migrations changes before deploying.
    command: ["true"]
    <<: *app-env
    environment:
      RUN_MIGRATIONS: "true"
      MIGRATION_PREFLIGHT_ALLOW_PENDING: "true"
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks:
      - taskapp-net
    restart: "no"

  pgbouncer:
    image: bitnamilegacy/pgbouncer:1.24.1-debian-12-r10
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      PGBOUNCER_DATABASE: taskapp
      POSTGRESQL_DATABASE: taskapp
      POSTGRESQL_USERNAME: taskapp
      POSTGRESQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/6432'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - taskapp-net
    restart: unless-stopped

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: taskapp/postgres:16-pg_partman
    environment:
      POSTGRES_DB: taskapp
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=4GB
      - -c
      - shared_buffers=2GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapp -d taskapp"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - taskapp-net
    restart: unless-stopped

  redis-1:
    <<: *redis-node
    networks:
      taskapp-net:
        aliases:
          - redis-1
    volumes:
      - redisdata1:/data
    command: >-
      sh -ec 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
      --masterauth "$${REDIS_PASSWORD}" --maxmemory 2gb --maxmemory-policy noeviction'

  redis-2:
    <<: *redis-node
    networks:
      taskapp-net:
        aliases:
          - redis-2
    volumes:
      - redisdata2:/data
    command: >-
      sh -ec 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
      --masterauth "$${REDIS_PASSWORD}" --replicaof redis-1 6379
      --maxmemory 2gb --maxmemory-policy noeviction'

  redis-3:
    <<: *redis-node
    networks:
      taskapp-net:
        aliases:
          - redis-3
    volumes:
      - redisdata3:/data
    command: >-
      sh -ec 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
      --masterauth "$${REDIS_PASSWORD}" --replicaof redis-1 6379
      --maxmemory 2gb --maxmemory-policy noeviction'

  redis-sentinel-1:
    <<: *sentinel-node
    depends_on:
      redis-1:
        condition: service_healthy

  redis-sentinel-2:
    <<: *sentinel-node
    depends_on:
      redis-1:
        condition: service_healthy

  redis-sentinel-3:
    <<: *sentinel-node
    depends_on:
      redis-1:
        condition: service_healthy

  minio-1:
    <<: *minio-node
    volumes:
      - miniodata1:/data

  minio-2:
    <<: *minio-node
    volumes:
      - miniodata2:/data

  minio-3:
    <<: *minio-node
    volumes:
      - miniodata3:/data

  minio-4:
    <<: *minio-node
    volumes:
      - miniodata4:/data

volumes:
  pgdata:
    name: taskapp_pgdata
  redisdata1:
    name: taskapp_redisdata1
  redisdata2:
    name: taskapp_redisdata2
  redisdata3:
    name: taskapp_redisdata3
  miniodata1:
    name: taskapp_miniodata1
  miniodata2:
    name: taskapp_miniodata2
  miniodata3:
    name: taskapp_miniodata3
  miniodata4:
    name: taskapp_miniodata4
  backups:
    name: taskapp_backups

networks:
  taskapp-net:
    name: taskapp-net
    driver: bridge