# ──────────────────────────────────────────────
# TaskApp — NGINX plain-HTTP configuration (no TLS)
#
# Used when TASKAPP_HTTP_ONLY=true (see docs/install.md §8.7). The application
# itself is HTTPS-agnostic (login, CSRF, Socket.IO all work over HTTP), but the
# PWA service worker requires a secure context, so it is skipped on plain HTTP.
# ──────────────────────────────────────────────

events {
  worker_connections 1024;
}

http {
  # ── Rate limiting ───────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  # ── Upstreams ───────────────────────────────
  upstream app_backend {
    zone app_backend 64k;
    server app-1:3000;
    server app-2:3000;
  }

  # ── Server ──────────────────────────────────
  server {
    listen 80;
    server_name _;

    # ── Logging ───────────────────────────────
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # ── Security headers (no HSTS over plain HTTP) ──
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ── Rate limiting ─────────────────────────
    limit_req zone=api burst=50 nodelay;

    # ── Proxy settings ────────────────────────
    location / {
      proxy_pass http://app_backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket support
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";

      proxy_read_timeout    60s;
      proxy_connect_timeout 10s;
      proxy_send_timeout    60s;

      # Buffering
      proxy_buffering on;
      proxy_buffer_size   4k;
      proxy_buffers       8 4k;
      proxy_busy_buffers_size 8k;
    }

    # ── Static assets (long cache) ────────────
    location /_next/static/ {
      proxy_pass http://app_backend;
      expires 365d;
      add_header Cache-Control "public, immutable";
    }

    location /public/ {
      proxy_pass http://app_backend;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }
  }
}
