# ──────────────────────────────────────────────
# TaskApp — NGINX Reverse Proxy Configuration
# ──────────────────────────────────────────────

events {
  worker_connections 1024;
}

http {
  # ── Rate limiting ───────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  # ── Upstreams ───────────────────────────────
  # `resolve` + zone re-resolves the Docker DNS name so all app replicas
  # are load-balanced; required for > 1 app replica.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream app_backend {
    zone app_backend 64k;
    server app:3000 resolve;
  }

  # ── Server ──────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name _;

    # ── SSL ───────────────────────────────────
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Logging ───────────────────────────────
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # ── Security headers ──────────────────────
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # CSP is emitted by the application. Do not add a second CSP header here;
    # browsers enforce multiple policies cumulatively.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Rate limiting ─────────────────────────
    limit_req zone=api burst=50 nodelay;

    # ── Proxy settings ────────────────────────
    location / {
      proxy_pass http://app_backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket support
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";

      proxy_read_timeout    60s;
      proxy_connect_timeout 10s;
      proxy_send_timeout    60s;

      # Buffering
      proxy_buffering on;
      proxy_buffer_size   4k;
      proxy_buffers       8 4k;
      proxy_busy_buffers_size 8k;
    }

    # ── Static assets (long cache) ────────────
    location /_next/static/ {
      proxy_pass http://app_backend;
      expires 365d;
      add_header Cache-Control "public, immutable";
    }

    location /public/ {
      proxy_pass http://app_backend;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }
  }
}
