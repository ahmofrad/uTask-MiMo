route:
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-email'

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://alertmanager-webhook:9093/webhook'
  - name: 'critical-email'
    email_configs:
      - to: 'admin@corp.example.com'
        from: 'taskapp-alerts@corp.example.com'
        smarthost: 'localhost:25'
