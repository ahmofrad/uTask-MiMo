apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskapp.fullname" . }}
  labels:
    {{- include "taskapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ required "secret.dbPassword is required" .Values.secret.dbPassword | quote }}
  auth-secret: {{ required "secret.authSecret is required" .Values.secret.authSecret | quote }}
  s3-access-key: {{ required "secret.s3AccessKey is required" .Values.secret.s3AccessKey | quote }}
  s3-secret-key: {{ required "secret.s3SecretKey is required" .Values.secret.s3SecretKey | quote }}
  DATABASE_URL: {{ printf "postgresql://taskapp:%s@%s-pgbouncer:6432/taskapp" (urlquery (required "secret.dbPassword is required" .Values.secret.dbPassword)) (include "taskapp.fullname" .) | quote }}
  AUTH_SECRET: {{ required "secret.authSecret is required" .Values.secret.authSecret | quote }}
  NEXTAUTH_SECRET: {{ required "secret.authSecret is required" .Values.secret.authSecret | quote }}
  WEBHOOK_SECRET_ENCRYPTION_KEY: {{ required "secret.webhookSecretEncryptionKey is required" .Values.secret.webhookSecretEncryptionKey | quote }}
  S3_ACCESS_KEY: {{ required "secret.s3AccessKey is required" .Values.secret.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ required "secret.s3SecretKey is required" .Values.secret.s3SecretKey | quote }}
  SMTP_HOST: {{ .Values.secret.smtpHost | default "" | quote }}
  SMTP_PORT: {{ .Values.secret.smtpPort | default "587" | quote }}
  SMTP_USER: {{ .Values.secret.smtpUser | default "" | quote }}
  SMTP_PASS: {{ .Values.secret.smtpPassword | default "" | quote }}
  SMTP_FROM: {{ .Values.secret.smtpFrom | default "" | quote }}
  LDAP_URL: {{ .Values.secret.ldapUrl | default "" | quote }}
  LDAP_BIND_DN: {{ .Values.secret.ldapBindDn | default "" | quote }}
  LDAP_BIND_PASSWORD: {{ .Values.secret.ldapBindPassword | default "" | quote }}
  LDAP_SEARCH_BASE: {{ .Values.secret.ldapSearchBase | default "" | quote }}
  LDAP_DEFAULT_ROLE: {{ .Values.secret.ldapDefaultRole | default "member" | quote }}
  SAML_ENTITY_ID: {{ .Values.secret.samlEntityId | default "" | quote }}
  SAML_IDP_METADATA_URL: {{ .Values.secret.samlIdpMetadataUrl | default "" | quote }}
