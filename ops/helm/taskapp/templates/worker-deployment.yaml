apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskapp.fullname" . }}-worker
  labels:
    {{- include "taskapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "taskapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "taskapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "taskapp.serviceAccountName" . }}
      initContainers:
        - name: wait-for-migrations
          image: "{{ .Values.worker.image }}:{{ .Values.worker.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - >-
              until npx --no-install prisma migrate status >/dev/null 2>&1; do
                sleep 5;
              done
          envFrom:
            - configMapRef:
                name: {{ include "taskapp.fullname" . }}
            - secretRef:
                name: {{ include "taskapp.fullname" . }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image }}:{{ .Values.worker.tag }}"
          imagePullPolicy: IfNotPresent
          args: ["node", "dist/worker.js"]
          envFrom:
            - configMapRef:
                name: {{ include "taskapp.fullname" . }}
            - secretRef:
                name: {{ include "taskapp.fullname" . }}
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/taskapp-worker-ready"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
