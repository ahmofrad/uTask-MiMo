app:
  image: taskapp/app
  tag: "1.0.0"
  replicas: 3
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

worker:
  image: taskapp/app
  tag: "1.0.0"
  replicas: 2
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

serviceAccount:
  create: false
  name: ""

postgres:
  enabled: true
  storageSize: 200Gi
  storageClass: ssd
  version: "16"
  image: taskapp-postgres
  tag: "16-pg_partman"
  imagePullPolicy: IfNotPresent
  # Build the custom image with: docker build -t taskapp-postgres:16-pg_partman ops/docker/postgres/

pgbouncer:
  enabled: true
  replicas: 2

redis:
  enabled: true
  # The bundled chart deploys one Redis instance. Use an external Sentinel/
  # cluster endpoint for HA; this chart does not create Sentinel topology.
  mode: standalone
  sentinelCount: 1
  storageSize: 20Gi

minio:
  enabled: true
  # The bundled chart deploys one MinIO instance. Use external distributed
  # MinIO/S3 for HA; this chart does not create distributed drive topology.
  mode: standalone
  drives: 1
  storageSize: 500Gi

ingress:
  enabled: true
  className: nginx
  host: ""
  tls:
    secretName: taskapp-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

backup:
  enabled: true
  schedule: "0 2 * * *"
  destination: s3
  s3:
    bucket: corp-backups
    endpoint: https://s3.corp.example.com
  retention: 30

config:
  siteName: TaskApp
  defaultLocale: fa-IR
  defaultAccent: "#2563eb"
  authUrl: ""
  s3Bucket: taskapp

secret:
  # Supply these through an external values file or a secret manager in production.
  dbPassword: ""
  authSecret: ""
  webhookSecretEncryptionKey: ""
  s3AccessKey: ""
  s3SecretKey: ""
  smtpHost: ""
  smtpPort: "587"
  smtpUser: ""
  smtpPassword: ""
  smtpFrom: ""
